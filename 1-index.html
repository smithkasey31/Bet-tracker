<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0b0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bet Tracker</title>
<!-- v4: cache-proof - per-request cache-busting on sheet+ESPN, no-store metas, rnd param busts gviz server cache -->
<style>
  :root{
    --bg:#0b0e13; --card:#141922; --card2:#1a2130; --line:#232c3b;
    --text:#e8ecf1; --muted:#8b96a6; --green:#2ecc71; --red:#ff5a5a;
    --blue:#4aa3ff; --purple:#b47aff; --orange:#ffa94d; --gold:#ffd166;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;padding-bottom:48px}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  header.top{position:sticky;top:0;z-index:10;background:linear-gradient(#0b0e13 82%,transparent);padding:14px 0 10px}
  .brand{display:flex;align-items:baseline;justify-content:space-between}
  .brand h1{font-size:13px;letter-spacing:.18em;color:var(--muted);font-weight:700;text-transform:uppercase}
  .brand .updated{font-size:11px;color:var(--muted)}
  .pnl-hero{margin-top:6px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .pnl-big{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .pnl-sub{font-size:12px;color:var(--muted);margin-top:4px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:64px;flex:1}
  .chip .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .chip .v{font-family:var(--mono);font-size:15px;font-weight:600;margin-top:2px}
  h2.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
  h2.sec .dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px}
  .bet-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .bet-name{font-weight:650;font-size:15px}
  .bet-event{font-size:12px;color:var(--muted);margin-top:2px}
  .odds{font-family:var(--mono);font-size:12px;color:var(--gold);background:#262b18;border:1px solid #3a3c22;border-radius:6px;padding:2px 6px;white-space:nowrap}
  .src{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1.5px 6px;margin-left:6px;vertical-align:1px}
  .src-Kasey{background:#12283f;color:var(--blue);border:1px solid #1f4468}
  .src-Instinct{background:#251637;color:var(--purple);border:1px solid #40295e}
  .src-Fable{background:#33240f;color:var(--orange);border:1px solid #54401c}
  .score-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;background:var(--card2);border-radius:9px;padding:8px 10px}
  .score-teams{font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .score-teams .dim{color:var(--muted);font-weight:400}
  .game-state{font-size:11px;color:var(--muted);text-align:right}
  .game-state .live{color:var(--red);font-weight:700}
  .cover{margin-top:8px;font-size:12px;font-weight:650}
  .cover.good{color:var(--green)} .cover.bad{color:var(--red)} .cover.na{color:var(--muted);font-weight:400}
  .meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
  .stake{font-family:var(--mono)}
  .result-chip{font-family:var(--mono);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
  .rc-W{background:#0f2e1d;color:var(--green);border:1px solid #1d5238}
  .rc-L{background:#33161a;color:var(--red);border:1px solid #5c252c}
  .rc-P{background:#2a2410;color:var(--gold);border:1px solid #4a4020}
  .notes{margin-top:8px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
  .src-card{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .src-stats{display:flex;gap:14px;font-family:var(--mono);font-size:13px;text-align:right}
  .src-stats .lab{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  .date-h{font-size:12px;color:var(--muted);margin:14px 0 7px;font-weight:600}
  .err{background:#33161a;border:1px solid #5c252c;color:var(--red);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
  .refresh-btn{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 10px;font-size:12px}
  footer{margin-top:26px;font-size:11px;color:#525c6b;text-align:center;line-height:1.7}
  footer a{color:#6b7688}
  .skeleton{color:var(--muted);text-align:center;padding:40px 0;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div id="liveSec"></div>
  <header class="top">
    <div class="brand">
      <h1>Bet Tracker · 2026-27</h1>
      <span class="updated" id="updated">loading…</span>
    </div>
    <div class="pnl-hero">
      <div>
        <div class="pnl-big" id="netPnl">—</div>
        <div class="pnl-sub" id="netSub">net profit / loss</div>
      </div>
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>
    <div class="chips" id="statChips"></div>
    <div id="errBox"></div>
  </header>

  <div id="pendSec"></div>
  <div id="srcSec"></div>
  <div id="histSec"></div>

  <footer>
    Reads live from the Google Sheet · scores from ESPN<br>
    Auto-refreshes every <span id="cad">60</span>s during games
  </footer>
</div>

<script>
'use strict';
const SHEET_ID = '1yRjj20cFZ5nvWMKNXj4SJ5_9Wy-c2tJG5DnNYKMC0Ss';
function gvizUrl(){
  // rnd inside tqx busts Google's server-side gviz query cache; _ts busts any client/proxy cache
  const ts = Date.now();
  return 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=' +
    encodeURIComponent('out:json;rnd:' + ts) + '&headers=1&_ts=' + ts + '&tq=' +
    encodeURIComponent('select A,B,C,D,E,F,G,H,I,J,K');
}
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard';
const TZ = 'America/Denver';
const UNIT = 20; // 1 unit = $20

/* ---------- parsing helpers ---------- */
const norm = s => (s||'').toLowerCase().replace(/[\u2018\u2019']/g,'')
  .replace(/\([^)]*\)/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const TEAM_ALIASES = {
  'cincy':'cincinnati','tenn st':'tennessee state','tenn state':'tennessee state',
  'bama':'alabama','nova':'villanova','zags':'gonzaga','cuse':'syracuse',
  'utah st':'utah state','miss st':'mississippi state','mich st':'michigan state',
  'penn st':'penn state','ohio st':'ohio state','okla st':'oklahoma state',
  'wash st':'washington state','ore st':'oregon state','ariz st':'arizona state',
  'fla st':'florida state','ga tech':'georgia tech','va tech':'virginia tech'
};
const canon = s => TEAM_ALIASES[s] || s;
const money = n => (n<0?'-$':'$') + Math.abs(n).toFixed(2);
const signed = n => (n>=0?'+':'') + money(n).replace('$','$');
const fmtSigned = n => (n>=0?'+':'-') + '$' + Math.abs(n).toFixed(2);
function parseMoney(v){
  if (v==null) return null;
  if (typeof v === 'number') return v;
  const m = String(v).replace(/[,$+\s]/g,'');
  if (m==='' ) return null;
  const n = parseFloat(m);
  return isNaN(n)? null : n;
}
function gvizDate(v){
  if (typeof v === 'string'){
    const m = v.match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+))?/);
    if (m) return new Date(+m[1], +m[2], +m[3], +(m[4]||0), +(m[5]||0));
  }
  return null;
}
function dateKey(d){ return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0'); }
function dateLabel(d){ return d.toLocaleDateString('en-US',{timeZone:TZ, weekday:'short', month:'short', day:'numeric'}); }
function fmtOdds(s){
  const t = (s||'').trim();
  if (/^[1-9]\d{2,}$/.test(t)) return '+' + t;
  return t;
}

/* ---------- sheet ---------- */
async function loadSheet(){
  const res = await fetch(gvizUrl(), {cache:'no-store'});
  const txt = await res.text();
  const i = txt.indexOf('('), j = txt.lastIndexOf(')');
  const data = JSON.parse(txt.slice(i+1, j));
  const bets = [];
  for (const row of (data.table.rows||[])){
    const c = row.c || [];
    const cv = k => c[k] ? (c[k].f !== undefined ? c[k].f : c[k].v) : null;
    const date = gvizDate(c[0] && c[0].v);
    const event = cv(2), bet = cv(3);
    if (!event && !bet) continue;
    bets.push({
      date, dateStr: date ? dateKey(date) : '',
      time: cv(1) || '',
      event: event || '', bet: bet || '',
      odds: fmtOdds(cv(4) || ''),
      source: (cv(5)||'').trim(),
      stake: parseMoney(c[6] ? c[6].v : cv(6)),
      result: (cv(7)||'Pending').trim() || 'Pending',
      payout: parseMoney(c[8] ? c[8].v : cv(8)),
      running: parseMoney(c[9] ? c[9].v : cv(9)),
      notes: (cv(10)||'').trim()
    });
  }
  return bets;
}

/* ---------- ESPN ---------- */
async function loadScores(dateKeys){
  const all = [];
  const seen = new Set();
  const feeds = ['', '&groups=80', '&groups=81']; // default + full FBS + full FCS slate
  await Promise.all([...dateKeys].map(async dk =>
    Promise.all(feeds.map(async f => {
      try{
        const r = await fetch(ESPN + '?dates=' + dk + '&limit=400' + f + '&_ts=' + Date.now(), {cache:'no-store'});
        const j = await r.json();
        for (const ev of (j.events||[])){
          if (seen.has(ev.id)) continue;
          seen.add(ev.id); all.push(ev);
        }
      }catch(e){ /* one bad feed is fine */ }
    }))
  ));
  return all;
}
function splitEvent(event){
  const n = (event||'').toLowerCase().replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
  const parts = n.split(/\s+(?:at|vs\.?|@)\s+/);
  return parts.length >= 2 ? [canon(norm(parts[0])), canon(norm(parts.slice(1).join(' ')))] : null;
}
function compFields(comp){
  const t = comp.team || {};
  return [t.location, t.shortDisplayName, t.displayName, t.name, t.nickname, t.abbreviation].map(norm);
}
function teamMatchLevel(name, comp){
  const f = compFields(comp);
  if (f.includes(name)) return 2;
  const dn = norm((comp.team||{}).displayName);
  if (dn.startsWith(name + ' ')) return 1;
  return 0;
}
function matchGame(event, games){
  const parts = splitEvent(event);
  if (!parts) return null;
  let best = null, bestScore = 0;
  for (const g of games){
    const comps = ((g.competitions||[])[0]||{}).competitors || [];
    if (comps.length < 2) continue;
    const tries = [[0,1],[1,0]];
    for (const [ia, ib] of tries){
      const la = teamMatchLevel(parts[0], comps[ia]);
      const lb = teamMatchLevel(parts[1], comps[ib]);
      const score = la + lb;
      if (la > 0 && lb > 0 && score >= 3 && score > bestScore){ best = g; bestScore = score; }
    }
  }
  return best;
}
function findComp(name, game){
  const comps = ((game.competitions||[])[0]||{}).competitors || [];
  let best = null, lvl = 0;
  for (const c of comps){
    const l = teamMatchLevel(canon(norm(name)), c);
    if (l > lvl){ best = c; lvl = l; }
  }
  return best;
}
function parseSpread(betStr){
  const m = (betStr||'').match(/^(.*?)\s*([+-]\d+(?:\.\d+)?)\s*$/);
  if (!m) return null;
  return {team: m[1], line: parseFloat(m[2])};
}
function parseTotal(betStr){
  const m = (betStr||'').match(/^(over|under)\s+(\d+(?:\.\d+)?)\s*$/i);
  if (!m) return null;
  return {dir: m[1].toLowerCase(), line: parseFloat(m[2])};
}

/* ---------- render ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function srcBadge(s){ return s ? `<span class="src src-${esc(s)}">${esc(s)}</span>` : ''; }

function gameStateHtml(g){
  const st = g.status && g.status.type || {};
  if (st.state === 'in') return `<span class="live">LIVE</span> ${esc(st.shortDetail||'')}`;
  if (st.state === 'post') return esc(st.shortDetail || 'Final');
  const d = new Date(g.date);
  return d.toLocaleDateString('en-US',{timeZone:TZ,weekday:'short'}) + ' ' +
         d.toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'});
}
function scoreLine(g){
  const comps = ((g.competitions||[])[0]||{}).competitors || [];
  const away = comps.find(c=>c.homeAway==='away') || comps[1];
  const home = comps.find(c=>c.homeAway==='home') || comps[0];
  const st = (g.status&&g.status.type||{}).state;
  const sc = c => st === 'pre' ? '' : ' ' + (c.score ?? '0');
  return `<span class="dim">${esc((away.team||{}).shortDisplayName||'')}</span>${sc(away)} <span class="dim">@</span> ${esc((home.team||{}).shortDisplayName||'')}${sc(home)}`;
}
function coverHtml(b, g){
  const st = (g.status&&g.status.type||{}).state;
  if (st === 'pre') return '';
  const comps = ((g.competitions||[])[0]||{}).competitors || [];
  const num = c => parseFloat(c.score||'0');
  const sp = parseSpread(b.bet);
  const tot = parseTotal(b.bet);
  if (sp){
    const mine = findComp(sp.team, g);
    if (!mine) return `<div class="cover na">—</div>`;
    const opp = comps.find(c=>c!==mine);
    const margin = (num(mine) - num(opp)) + sp.line;
    const cls = margin > 0 ? 'good' : 'bad';
    const word = margin > 0 ? `Covering by ${margin.toFixed(1)}` : `Not covering (${margin.toFixed(1)})`;
    return `<div class="cover ${cls}">${word}${st==='post'?' · final':''}</div>`;
  }
  if (tot){
    const t = comps.reduce((a,c)=>a+num(c),0);
    const ok = tot.dir==='under' ? t < tot.line : t > tot.line;
    return `<div class="cover ${ok?'good':'bad'}">Total ${t} vs ${tot.dir} ${tot.line}${st==='post'?' · final':''}</div>`;
  }
  return `<div class="cover na"></div>`;
}
function betCard(b, g){
  const rcls = b.result==='W'?'rc-W':(b.result==='L'?'rc-L':'rc-P');
  const rtxt = b.result==='W'?'W':(b.result==='L'?'L':'PENDING');
  const pay = (b.result==='W'||b.result==='L') && b.payout!=null ?
    `<span class="${b.payout>=0?'pos':'neg'}" style="font-family:var(--mono);font-size:12px"> ${fmtSigned(b.payout)}</span>` : '';
  const score = g ? `<div class="score-row"><span class="score-teams">${scoreLine(g)}</span><span class="game-state">${gameStateHtml(g)}</span></div>${coverHtml(b,g)}` : '';
  const notes = b.notes ? `<div class="notes">${esc(b.notes)}</div>` : '';
  return `<div class="card">
    <div class="bet-head">
      <div>
        <div class="bet-name">${esc(b.bet)} ${b.odds?`<span class="odds">${esc(b.odds)}</span>`:''}${srcBadge(b.source)}</div>
        <div class="bet-event">${esc(b.event)}${b.date?` · ${dateLabel(b.date)}`:''}${b.time&&b.time!=='TBD'?` ${esc(b.time)}`:''}</div>
      </div>
      <span class="result-chip ${rcls}">${rtxt}</span>
    </div>
    ${score}
    <div class="meta-row">
      <span class="stake">stake ${b.stake!=null?money(b.stake):'—'}</span>
      <span>${pay}${b.running!=null&&(b.result==='W'||b.result==='L')?` <span style="color:var(--muted);font-size:11px">· running ${money(b.running)}</span>`:''}</span>
    </div>
    ${notes}
  </div>`;
}
function statsFor(bets){
  const graded = bets.filter(b=>b.result==='W'||b.result==='L');
  const w = graded.filter(b=>b.result==='W').length;
  const l = graded.filter(b=>b.result==='L').length;
  const net = graded.reduce((a,b)=>a+(b.payout||0),0);
  const staked = bets.reduce((a,b)=>a+(b.stake||0),0);
  const stakedGraded = graded.reduce((a,b)=>a+(b.stake||0),0);
  return {w,l,net,staked,stakedGraded,units:net/UNIT,
    winPct: (w+l)? w/(w+l):null,
    roi: stakedGraded? net/stakedGraded : null,
    pending: bets.filter(b=>b.result!=='W'&&b.result!=='L').length};
}
function chip(k,v,cls){ return `<div class="chip"><div class="k">${k}</div><div class="v ${cls||''}">${v}</div></div>`; }

function render(bets, games){
  const st = statsFor(bets);
  const netEl = document.getElementById('netPnl');
  netEl.textContent = fmtSigned(st.net);
  netEl.className = 'pnl-big ' + (st.net>=0?'pos':'neg');
  document.getElementById('netSub').textContent =
    `${st.w}-${st.l} record · ${st.pending} pending`;
  document.getElementById('statChips').innerHTML =
    chip('Win %', st.winPct!=null?(st.winPct*100).toFixed(0)+'%':'—') +
    chip('Units', (st.units>=0?'+':'')+st.units.toFixed(1), st.units>=0?'pos':'neg') +
    chip('Staked', money(st.staked)) +
    chip('ROI', st.roi!=null?((st.roi*100).toFixed(1)+'%'):'—', st.roi!=null?(st.roi>=0?'pos':'neg'):'');

  // match games
  const matched = bets.map(b => (b.result==='W'||b.result==='L') ? null : matchGame(b.event, games));
  const liveIdx = [], pendIdx = [];
  bets.forEach((b,i)=>{
    if (b.result==='W'||b.result==='L') return;
    const g = matched[i];
    const state = g && g.status && g.status.type ? g.status.type.state : null;
    if (state === 'in' || state === 'post') liveIdx.push(i); else pendIdx.push(i);
  });
  pendIdx.sort((a,b)=> (bets[a].date?.getTime()||9e15) - (bets[b].date?.getTime()||9e15) || String(bets[a].time).localeCompare(String(bets[b].time)));

  document.getElementById('liveSec').innerHTML = liveIdx.length ?
    `<h2 class="sec"><span class="dot"></span> Live now</h2>` + liveIdx.map(i=>betCard(bets[i], matched[i])).join('') : '';
  document.getElementById('pendSec').innerHTML = pendIdx.length ?
    `<h2 class="sec">Pending · ${pendIdx.length}</h2>` + pendIdx.map(i=>betCard(bets[i], matched[i])).join('') : '';

  const bySrc = {};
  for (const b of bets){ const s = b.source||'Unknown'; (bySrc[s] = bySrc[s]||[]).push(b); }
  const order = ['Kasey','Instinct','Fable'];
  const srcHtml = order.filter(s=>bySrc[s]).concat(Object.keys(bySrc).filter(s=>!order.includes(s))).map(s=>{
    const t = statsFor(bySrc[s]);
    return `<div class="card src-card">
      <span class="src src-${esc(s)}" style="font-size:11px">${esc(s)}</span>
      <div class="src-stats">
        <span><span class="lab">Record</span>${t.w}-${t.l}${t.pending?` ·${t.pending}p`:''}</span>
        <span><span class="lab">Units</span><span class="${t.units>=0?'pos':'neg'}">${(t.units>=0?'+':'')+t.units.toFixed(1)}</span></span>
        <span><span class="lab">Net</span><span class="${t.net>=0?'pos':'neg'}">${fmtSigned(t.net)}</span></span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('srcSec').innerHTML = `<h2 class="sec">By source</h2>` + srcHtml;

  const graded = bets.map((b,i)=>({b,i})).filter(x=>x.b.result==='W'||x.b.result==='L');
  graded.sort((a,b)=> (b.b.date?.getTime()||0) - (a.b.date?.getTime()||0) || b.i - a.i);
  let hist = '', lastDk = '';
  for (const {b} of graded){
    const dk = b.dateStr;
    if (dk !== lastDk){ hist += `<div class="date-h">${b.date?dateLabel(b.date):'—'}</div>`; lastDk = dk; }
    hist += betCard(b, null);
  }
  document.getElementById('histSec').innerHTML = `<h2 class="sec">Graded · ${graded.length}</h2>` + hist;

  document.getElementById('updated').textContent =
    'updated ' + new Date().toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit',second:'2-digit'});
  return liveIdx.length > 0;
}

/* ---------- boot ---------- */
let timer = null;
async function refresh(){
  const errBox = document.getElementById('errBox');
  try{
    const bets = await loadSheet();
    const today = new Date();
    const keys = new Set([dateKey(today)]);
    for (const b of bets){
      if (b.date && b.result!=='W' && b.result!=='L') keys.add(b.dateStr);
    }
    const games = await loadScores(keys);
    const anyLive = render(bets, games);
    errBox.innerHTML = '';
    const cad = anyLive ? 30 : 60;
    document.getElementById('cad').textContent = cad;
    clearTimeout(timer);
    timer = setTimeout(refresh, cad*1000);
  }catch(e){
    errBox.innerHTML = `<div class="err">Couldn't load data (${esc(e.message)}). Retrying in 60s.</div>`;
    clearTimeout(timer);
    timer = setTimeout(refresh, 60000);
  }
}
document.getElementById('refreshBtn').addEventListener('click', refresh);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refresh(); });
document.getElementById('liveSec').innerHTML = '<div class="skeleton">Loading bets…</div>';
refresh();
</script>
</body>
</html>
